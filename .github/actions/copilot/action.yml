name: Run Copilot CLI
description: Run @github/copilot CLI programmatically in a workflow and process the output

inputs:
  prompt:
    description: 'Prompt to pass to the Copilot CLI'
    required: true
  output-cmd:
    description: 'Command to run after Copilot finishes to process its result (e.g. write to $GITHUB_STEP_SUMMARY or $GITHUB_OUTPUT)'
    required: false
    default: ''
  args:
    description: 'Additional arguments to pass to the Copilot CLI (e.g. --allow-tool=shell(git:*) --allow-tool=write)'
    required: false
    default: ''
  token:
    description: 'GitHub token for Copilot authentication'
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: ApiTreeCZ/github-actions/.github/actions/setup-node@v0.6.5

    - name: Run Copilot CLI
      env:
        COPILOT_GITHUB_TOKEN: ${{ inputs.token }}
        # The prompt is data, not shell source: passing it through the environment
        # keeps backticks, $(...) and quotes in it from being expanded by bash.
        COPILOT_PROMPT: ${{ inputs.prompt }}
        # Copilot matches `--allow-tool=shell(<cmd>:*)` rules against the command
        # name, so a command the model prefixes with `PAGER=cat ...` matches no
        # rule and is denied outright under `--no-ask-user`. Disable paging here
        # so the model never has a reason to add such a prefix.
        PAGER: cat
        GH_PAGER: cat
        GIT_PAGER: cat
      # `args` is interpolated on purpose: it carries CLI flags that the shell has
      # to word-split and unquote before Copilot sees them.
      run: pnpm dlx @github/copilot -p "$COPILOT_PROMPT" ${{ inputs.args }} --no-ask-user
      shell: bash

    - name: Process Copilot output
      if: ${{ inputs.output-cmd != '' }}
      run: ${{ inputs.output-cmd }}
      shell: bash
