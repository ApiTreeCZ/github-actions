name: Set up Turbo
description: Set up Turbo cache for CI

inputs:
  op-service-account-token:
    description: '1Password service account token with access to the vault containing Turbo secrets'
    required: true

  op-turbo-api-secret:
    description: '1Password secret path for the Turbo API URL'
    default: 'apitree-infra/turbo-remote-cache/TURBO_API'
    required: false

  op-turbo-token-secret:
    description: '1Password secret path for the Turbo token'
    default: 'apitree-infra/turbo-remote-cache/TURBO_TOKEN'
    required: false

  op-turbo-remote-cache-signature-key-secret:
    description: '1Password secret path for the Turbo signature key'
    default: 'apitree-infra/turbo-remote-cache/TURBO_REMOTE_CACHE_SIGNATURE_KEY'
    required: false

  dir:
    description: 'The directory to use for the Turbo cache'
    default: '.turbo'
    required: false

  cache-key:
    description: 'The key to use for the Turbo local cache'
    default: 'turbo-cache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}'
    required: false

  restore-keys:
    description: 'The restore keys to use for the Turbo local cache'
    default: 'turbo-cache-${{ runner.os }}-${{ runner.arch }}-'
    required: false

runs:
  using: composite
  steps:
    - name: Set up Turbo local cache
      uses: actions/cache@v6
      with:
        path: ${{ inputs.dir }}
        key: ${{ inputs.cache-key }}
        restore-keys: ${{ inputs.restore-keys }}

    - name: Load Turbo secrets
      uses: ApiTreeCZ/github-actions/.github/actions/load-secrets@v0.6.0
      id: load-secrets
      with:
        op-service-account-token: ${{ inputs.op-service-account-token }}
        export-env: 'true'
        secrets: |
          TURBO_API=op://${{ inputs.op-turbo-api-secret }}
          TURBO_TOKEN=op://${{ inputs.op-turbo-token-secret }}
          TURBO_REMOTE_CACHE_SIGNATURE_KEY=op://${{ inputs.op-turbo-remote-cache-signature-key-secret }}

    - name: Derive TURBO_TEAM from repository name
      shell: bash
      # language=bash
      run: |
        TURBO_TEAM=$(echo "${GITHUB_REPOSITORY}" | cut -d '/' -f2)
        echo "TURBO_TEAM=$TURBO_TEAM" >>$GITHUB_ENV

    - name: Disable Turbo telemetry
      shell: bash
      # language=bash
      run: |
        echo "TURBO_TELEMETRY_DISABLED=1" >>$GITHUB_ENV
