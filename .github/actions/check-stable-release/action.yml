name: Check stable release
description: Checks whether the triggering workflow is a stable release

inputs:
  commit-message:
    description: 'Exact release commit message used for detection'
    required: false
    default: 'chore(main): release'

  commit-author:
    description: 'Exact username of the commit author used for detection'
    required: false
    default: 'apitree-github-actions[bot]'

  dispatch-stable-release:
    description: 'Treat a workflow_dispatch on main as a stable release (recovers a release whose push never ran)'
    required: false
    default: 'false'

outputs:
  result:
    description: Indicates whether the workflow is a stable release or not
    value: ${{ steps.check-stable-release.outputs.result }}

runs:
  using: composite
  steps:
    - id: check-stable-release
      shell: bash
      # language=bash
      run: |
        PUSHED=${{ github.ref_name == 'main' && github.event_name == 'push' && github.event.head_commit.message == inputs.commit-message && github.event.head_commit.author.username == inputs.commit-author }}
        DISPATCHED=${{ github.ref_name == 'main' && github.event_name == 'workflow_dispatch' && inputs.dispatch-stable-release == 'true' }}

        if [ "$PUSHED" == "true" ]; then
          echo "Release commit detected. This is a stable release."
          RESULT=true
        elif [ "$DISPATCHED" == "true" ]; then
          echo "Stable release requested by workflow dispatch on main."
          RESULT=true
        else
          echo "Release commit not detected."
          RESULT=false
        fi

        echo "result=$RESULT" >> $GITHUB_OUTPUT
