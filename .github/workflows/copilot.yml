name: Copilot

on:
  pull_request:
    branches:
      - main
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WAIT_FOR_CHECKS_MATCH_PATTERN: '^(commitlint|manypkg|eslint|tsc|prettier|qa|test)$'

jobs:
  wait-for-checks:
    runs-on: ubuntu-latest
    permissions:
      checks: read
    steps:
      - name: Wait for CI checks
        uses: poseidon/wait-for-status-checks@v0.7.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          match_pattern: ${{ env.WAIT_FOR_CHECKS_MATCH_PATTERN }}

  renovate:
    runs-on: ubuntu-latest
    needs: wait-for-checks
    if: ${{ github.actor == 'renovate[bot]' && success() }}
    permissions:
      copilot-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up project
        uses: ApiTreeCZ/github-actions/.github/actions/setup-project@v0.6.2
        with:
          op-service-account-token: ${{ secrets.OP_APITREE_INFRA_SERVICE_ACCOUNT_TOKEN }}

      - name: Load secrets
        id: load-secrets
        uses: ApiTreeCZ/github-actions/.github/actions/load-secrets@v0.6.2
        with:
          op-service-account-token: ${{ secrets.OP_APITREE_INFRA_SERVICE_ACCOUNT_TOKEN }}
          secrets: |
            COPILOT_GITHUB_TOKEN=op://apitree-infra/github-actions/COPILOT_GITHUB_TOKEN

      - name: Parse secrets
        id: parse-secrets
        uses: ApiTreeCZ/github-actions/.github/actions/json-to-outputs@v0.6.2
        with:
          json: ${{ steps.load-secrets.outputs.secrets }}

      - name: Authenticate with GitHub CLI
        # language=bash
        run: |
          echo "${{ steps.parse-secrets.outputs.COPILOT_GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Prompt Copilot to auto-approve the PR
        id: copilot
        uses: ApiTreeCZ/github-actions/.github/actions/copilot@v0.6.2
        with:
          args: "--allow-tool='shell(gh:*)' --allow-tool='shell(git:*)'"
          prompt: |
            You are Renovate bot Copilot that can analyze automated dependency update pull requests and approve them if they meet the conditions.
            The pull request no. ${{ github.event.pull_request.number }} is created by the Renovate bot.
            Use `gh` and `git` CLI to to analyze the PR and approve it if all the following conditions are met:
            - The PR contains only dependency updates (no other code changes).
            - All version updates are non-major (i.e., no breaking changes).
            If the PR meets the conditions, approve it via `gh` CLI. Do nothing if it does not meet the conditions.
